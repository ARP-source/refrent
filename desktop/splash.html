<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02070A; color: #d6e3ee;
    font-family: "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
  .sky { position: absolute; inset: 0;
    background:
      radial-gradient(120% 70% at 50% 120%, rgba(252,115,77,.65) 0%, rgba(252,115,77,.2) 30%, rgba(2,151,222,.35) 55%, rgba(2,7,10,0) 80%),
      radial-gradient(60% 50% at 50% 0%, rgba(2,151,222,.3), rgba(2,7,10,0) 70%); }
  .beams { position: absolute; inset: 30% 0 0 0;
    background: repeating-linear-gradient(90deg, transparent 0 11px, rgba(95,196,242,.12) 11px 12px, transparent 12px 26px);
    -webkit-mask-image: radial-gradient(70% 100% at 50% 100%, #000, transparent 80%); animation: drift 6s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-8px) } to { transform: translateX(8px) } }
  .orb { position: absolute; left: 50%; bottom: 46px; width: 56px; height: 56px; margin-left: -28px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #ffd9cc 0%, #fc734d 40%, #c2410c 75%);
    box-shadow: 0 0 30px rgba(252,115,77,.8), 0 0 80px rgba(2,151,222,.35); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 44px rgba(252,115,77,.95), 0 0 100px rgba(2,151,222,.45); } }
  .brand { position: absolute; top: 22px; left: 26px; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  h1 { position: absolute; top: 74px; width: 100%; text-align: center; margin: 0; font-weight: 400;
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-size: 34px; color: #f1f7fb; }
  h1 i { color: #fdb59e; }
  #s { position: absolute; top: 130px; width: 100%; text-align: center; font: 11px/1.4 Consolas, monospace;
    letter-spacing: .14em; text-transform: uppercase; color: #7fa3bd; }
  #s.err { color: #fd9d82; text-transform: none; letter-spacing: 0; padding: 0 28px; box-sizing: border-box; }
</style>
</head>
<body>
  <div class="sky"></div><div class="beams"></div><div class="orb"></div>
  <div class="brand">RecallOS</div>
  <h1>Recall at the speed of <i>thought.</i></h1>
  <div id="s">Waking the memory engine...</div>
</body>
</html>
